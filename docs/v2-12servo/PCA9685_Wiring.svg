<text x="1200" y="945" font-size="24" fill="#596879" text-anchor="middle">Functional connection diagram: PCA9685 terminal order and board artwork are not reproduced.</text>
<rect x="70" y="981" width="1100" height="255" rx="14" fill="#fff0df"/>
<text x="98" y="1025" font-size="28" fill="#ef7949" text-anchor="start" class="bold">REQUIRED OE RESET BIAS · NOT YET VERIFIED</text>
<text x="100" y="1090" font-size="28" fill="#18232d" text-anchor="start" class="bold">3.3 V</text>
<line x1="210" y1="1080" x2="380" y2="1080" stroke="#ef7949" stroke-width="4" stroke-dasharray="10 7"/>
<rect x="380" y="1058" width="205" height="44" rx="0" fill="#ffffff" stroke="#ef7949" stroke-width="3"/>
<text x="482" y="1089" font-size="23" fill="#ef7949" text-anchor="middle" class="bold">R: to resolve</text>
<line x1="585" y1="1080" x2="760" y2="1080" stroke="#ef7949" stroke-width="4" stroke-dasharray="10 7"/>
<text x="780" y="1090" font-size="28" fill="#18232d" text-anchor="start" class="bold">OE</text>
<text x="98" y="1144" font-size="24" fill="#18232d" text-anchor="start">Measure the module’s existing pull-up / pull-down first.</text>
<text x="98" y="1178" font-size="24" fill="#18232d" text-anchor="start">Choose a compatible bias; verify OE HIGH while P4 is reset.</text>
<text x="98" y="1212" font-size="24" fill="#18232d" text-anchor="start">The internal GPIO pull-up alone does not prove reset safety.</text>
<rect x="1200" y="981" width="1130" height="255" rx="14" fill="#e6edf3"/>
<text x="1230" y="1025" font-size="28" fill="#18232d" text-anchor="start" class="bold">SERVO POWER &amp; CHANNELS</text>
<text x="1230" y="1075" font-size="25" fill="#18232d" text-anchor="start">VCC = chip logic. V+ = separate servo power rail.</text>
<text x="1230" y="1109" font-size="25" fill="#18232d" text-anchor="start">Leave V+ / screw power terminal and ALL servo plugs empty.</text>
<text x="1230" y="1143" font-size="25" fill="#18232d" text-anchor="start">Do not power twelve servos from P4 USB, 5 V or 3V3 pins.</text>
<text x="1230" y="1177" font-size="25" fill="#18232d" text-anchor="start">Channels 0–11: bench diagnostics only; joint map pending.</text>
<text x="1230" y="1211" font-size="25" fill="#18232d" text-anchor="start">Channels 12–15: unused. OE does not disconnect V+.</text>
<rect x="70" y="1280" width="2260" height="218" rx="16" fill="#18232d"/>
<text x="100" y="1328" font-size="30" fill="#ffac7b" text-anchor="start" class="bold">FIRST CHECK · EVERYTHING UNPOWERED</text>
<text x="100" y="1372" font-size="27" fill="#f0f4f7" text-anchor="start">Unplug P4 USB. With the PCA9685 still separate, measure resistance:</text>
<text x="100" y="1411" font-size="27" fill="#f0f4f7" text-anchor="start">OE↔GND   ·   OE↔VCC   ·   SDA↔VCC   ·   SCL↔VCC. Record settled readings or OL.</text>
<text x="100" y="1450" font-size="27" fill="#f0f4f7" text-anchor="start">A meter checks static wiring / voltage. A scope or analyzer is needed for PWM / reset timing.</text>
<text x="75" y="1547" font-size="24" fill="#596879" text-anchor="start">2026-09-15 · Address 0x40 expected · Nominal PWM 50 Hz · Follow PCA9685_WIRING.md before enabling diagnostics.</text>
</svg>
