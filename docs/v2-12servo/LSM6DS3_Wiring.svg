<text x="84" y="814" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#fff" font-weight="700" text-anchor="start">LOCAL STRAPS ON THE IMU BOARD</text>
<text x="90" y="880" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#18232d" font-weight="700" text-anchor="start">CS → 3V3</text>
<text x="390" y="880" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#18232d" font-weight="400" text-anchor="start">Selects I²C operation</text>
<text x="90" y="945" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#18232d" font-weight="700" text-anchor="start">SA0 → GND</text>
<text x="390" y="945" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#18232d" font-weight="400" text-anchor="start">Selects address 0x6A</text>
<text x="90" y="1010" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" fill="#18232d" font-weight="700" text-anchor="start">SCX + SDX → GND</text>
<text x="535" y="1010" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#18232d" font-weight="400" text-anchor="start">Unused auxiliary bus</text>
<rect x="1100" y="770" width="1040" height="285" rx="14" fill="#fff"/>
<rect x="1100" y="770" width="1040" height="65" rx="12" fill="#18232d"/>
<text x="1124" y="814" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#fff" font-weight="700" text-anchor="start">LEAVE UNCONNECTED</text>
<text x="1130" y="880" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#18232d" font-weight="700" text-anchor="start">VIN · INT1 · INT2 · DCS / OCS</text>
<text x="1130" y="940" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#18232d" font-weight="400" text-anchor="start">Keep existing PCA9685 on GPIO2 / 3.</text>
<text x="1130" y="990" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#18232d" font-weight="400" text-anchor="start">GPIO7 / 8 is shared with onboard media.</text>
<rect x="60" y="1085" width="2080" height="310" rx="14" fill="#fff"/>
<rect x="60" y="1085" width="2080" height="65" rx="12" fill="#18232d"/>
<text x="84" y="1129" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#fff" font-weight="700" text-anchor="start">BODY CONTROL → SELF-LEVELING · TWO DIFFERENT CALIBRATIONS</text>
<text x="90" y="1195" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#ed7848" font-weight="700" text-anchor="start">LEVEL REFERENCE</text>
<text x="510" y="1195" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#18232d" font-weight="400" text-anchor="start">Support frame at the desired level angle.</text>
<text x="510" y="1242" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#18232d" font-weight="400" text-anchor="start">Use current pose as level reference → Save on robot.</text>
<text x="90" y="1305" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#ed7848" font-weight="700" text-anchor="start">GYRO BIAS</text>
<text x="510" y="1305" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#18232d" font-weight="400" text-anchor="start">Keep completely still at any angle; click Calibrate stationary gyro bias.</text>
<text x="510" y="1352" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#18232d" font-weight="400" text-anchor="start">256 samples; saves and applies automatically. This does not redefine level.</text>
<text x="62" y="1450" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#596879" font-weight="400" text-anchor="start">P4 view: component side, USB-C at top. L/R labels count rows downward; they are not GPIO numbers.</text>
<text x="62" y="1494" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#596879" font-weight="400" text-anchor="start">Schematic connections only; module pin positions are not depicted. Mount rigidly to the frame.</text>
<text x="62" y="1538" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#596879" font-weight="400" text-anchor="start">The IMU measures rotation and acceleration. It does not measure servo position or body height.</text>
<text x="62" y="1577" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#596879" font-weight="400" text-anchor="start">2026-10-18 · See LSM6DS3_IMU.md for mounting axes, calibration, troubleshooting and sources.</text>
</svg>
