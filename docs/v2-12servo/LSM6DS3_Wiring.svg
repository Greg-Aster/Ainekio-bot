<title id="title">AINEKIO · LSM6DS3 GYRO / IMU</title><desc id="desc">Four P4 connections: 3V3 to IMU 3V3, GND to GND, GPIO8 to SCL and GPIO7 to SDA. Local straps CS to 3V3 and SA0, SCX, SDX to ground. VIN, INT1, INT2 and DCS are unused. Follow module labels, not drawing pin positions.</desc>
<rect x="0" y="0" width="2200" height="1600" rx="0" fill="#f5f7fa"/>
<text x="60" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="52" fill="#18232d" font-weight="700" text-anchor="start">AINEKIO · LSM6DS3 GYRO / IMU</text>
<text x="62" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#ed7848" font-weight="700" text-anchor="start">WAVESHARE ESP32-P4-WIFI6 · SHARED I²C0 · ADDRESS 0x6A</text>
<rect x="60" y="184" width="2080" height="64" rx="10" fill="#fff0df"/>
<text x="84" y="226" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#18232d" font-weight="700" text-anchor="start">Use the photographed module’s 3V3 pin · VIN stays unused · Disconnect power before rewiring.</text>
