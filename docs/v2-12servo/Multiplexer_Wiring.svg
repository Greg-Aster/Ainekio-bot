<text x="100" y="1367" font-size="26" fill="#18232d" text-anchor="start">One servo wiper wire per input. Label each wire by leg and joint.</text>
<text x="100" y="1404" font-size="24" fill="#596879" text-anchor="start">C0–C3 unused · input layout above is a checklist, not module orientation.</text>
<rect x="1430" y="1080" width="900" height="354" rx="16" fill="#ffffff" stroke="#d7e0e8" stroke-width="2"/>
<rect x="1430" y="1080" width="900" height="76" rx="14" fill="#18232d"/>
<text x="1458" y="1130" font-size="32" fill="#ffffff" text-anchor="start" class="bold">WHAT TO SOLDER</text>
<text x="1460" y="1201" font-size="30" fill="#18232d" text-anchor="start" class="bold">12 feedback pins: C4 through C15</text>
<text x="1460" y="1254" font-size="28" fill="#18232d" text-anchor="start">7 interface pins: VCC, GND, SIG, S0–S3</text>
<text x="1460" y="1307" font-size="28" fill="#18232d" text-anchor="start">EN → GND: solder a short local jumper</text>
<text x="1460" y="1360" font-size="26" fill="#596879" text-anchor="start">Or fit an EN pin and connect it to GND.</text>
<text x="1460" y="1403" font-size="25" fill="#596879" text-anchor="start">20 pins total if you fit a header pin at EN.</text>
<rect x="70" y="1470" width="2260" height="186" rx="16" fill="#18232d"/>
<text x="100" y="1517" font-size="27" fill="#ef7949" text-anchor="start" class="bold">KEEP THE EXISTING SERVO WIRES</text>
<text x="100" y="1557" font-size="25" fill="#f0f4f7" text-anchor="start">Power, ground and PWM stay on the PCA9685.</text>
<text x="100" y="1595" font-size="25" fill="#f0f4f7" text-anchor="start">Only the added wiper wire goes to C4–C15.</text>
<text x="100" y="1632" font-size="24" fill="#f0f4f7" text-anchor="start">Feedback voltage must stay between GND and module VCC.</text>
<line x1="1180" y1="1498" x2="1180" y2="1632" stroke="#526172" stroke-width="2"/>
<text x="1220" y="1517" font-size="27" fill="#ef7949" text-anchor="start" class="bold">SET THE INPUT MAPPING IN BODY CONTROL</text>
<text x="1220" y="1557" font-size="25" fill="#f0f4f7" text-anchor="start">C4–C15 is your wiring choice; software defaults to C0–C11.</text>
<text x="1220" y="1595" font-size="25" fill="#f0f4f7" text-anchor="start">Keep P4 / module powered while servo feedback is powered.</text>
<text x="1220" y="1632" font-size="24" fill="#f0f4f7" text-anchor="start">Connection diagram only: match labels, not drawing positions.</text>
