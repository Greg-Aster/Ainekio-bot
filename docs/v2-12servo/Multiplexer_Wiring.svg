<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1740" viewBox="0 0 2400 1740" role="img" aria-labelledby="title desc">
<title id="title">Ainekio P4 to CD74HC4067 servo feedback wiring, C4 to C15</title>
<desc id="desc">Seven P4 connections: 3V3 to VCC, ground to GND, GPIO49 to SIG, and GPIO27, 28, 29, 30 to S0, S1, S2, S3. Tie EN to GND on the module. Twelve fourth-wire servo feedback inputs use C4 through C15. Connector order is schematic, not physical.</desc>
